on:
  push:
    branches:
      - main
      - master
      - dev-adam
      - 2025_website
      - cursor/envdata-format-update-e284
  pull_request:
    branches:
      - main
      - master

# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
   # - cron:  '1 0 * * 0' #every sunday just after midnight
    - cron:  '0 0 * * *' #daily at midnight

name: targets

jobs:
  targets:
    runs-on: ubuntu-latest
    # Image built from eco-emma/emma_docker; ships the same renv.lock library.
    container: adamwilsonlab/emma:latest
    env:
      GITHUB_PAT: ${{ secrets.GH_PAT_BSM }}
      RENV_CONFIG_REPOS_OVERRIDE: ""
      # Prefer the container site-library (matches emma_docker renv.lock) before
      # installing anything project-local. No update.packages on every run.
      RENV_PATHS_LIBRARY: ${{ github.workspace }}/renv/library
      RENV_PATHS_CACHE: ${{ github.workspace }}/renv/cache
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch
      - uses: actions/checkout@v4
        with:
          lfs:  'true'
          fetch-depth: 0 # added
      - name: Whitelist directory
        run: git config --global --add safe.directory /__w/emma_report/emma_report
      - name: Checkout LFS objects
        run: git lfs checkout
        continue-on-error: true
      - name: Cache renv
        uses: actions/cache@v4
        with:
          path: |
            renv/library
            renv/cache
          key: renv-${{ hashFiles('renv.lock') }}
          restore-keys: |
            renv-
      - name: Restore R packages with renv
        run: |
          Rscript -e "
            options(repos = c(
              stan = 'https://stan-dev.r-universe.dev',
              ropensci = 'https://ropensci.r-universe.dev',
              RSPM = 'https://packagemanager.posit.co/cran/2026-10-01',
              CRAN = 'https://packagemanager.posit.co/cran/2026-10-01'
            ))
            if (!requireNamespace('renv', quietly = TRUE)) {
              install.packages('renv', repos = 'https://cloud.r-project.org')
            }
            # Restore from lockfile mirrored from emma_docker. Missing packages
            # install from the pinned P3M snapshot; already-present image
            # packages are reused when versions match. Never call update.packages().
            renv::restore(prompt = FALSE)
          "

      - name: Check if previous runs exists
        id: runs-exist
        run: git ls-remote --exit-code --heads origin ${{ steps.extract_branch.outputs.branch }}-runs
        continue-on-error: true

      - name: Checkout previous run
        if: steps.runs-exist.outcome == 'success'
        uses: actions/checkout@v2
        with:
          ref: ${{ steps.extract_branch.outputs.branch }}-runs
          fetch-depth: 1
          path: .${{ steps.extract_branch.outputs.branch }}-runs

      - name: Run targets pt 1
        run: |
          Sys.setenv(HOME="/home/rstudio")
          cmdstanr::set_cmdstan_path("/home/rstudio/.cmdstanr/cmdstan-2.28.1")
          cmdstanr::check_cmdstan_toolchain()
          #cmdstanr::install_cmdstan()
        shell: Rscript {0}

      - name: Run targets pt 2
        run: |
          targets::tar_destroy(destroy = "all",ask = FALSE)
          targets::tar_make()
        shell: Rscript {0}

      - name: Create the runs branch if it does not already exist
        if: steps.runs-exist.outcome != 'success'
        run: git checkout --orphan ${{ steps.extract_branch.outputs.branch }}-runs

      - name: Put the worktree in the runs branch if the latter already exists
        if: steps.runs-exist.outcome == 'success'
        run: |
          rm -r .git
          mv .${{ steps.extract_branch.outputs.branch }}-runs/.git .
          rm -r .${{ steps.extract_branch.outputs.branch }}-runs

      - name: Upload latest run
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          rm -r .github/workflows # .gitignore 
          git lfs track _targets/objects/* #use git LFS to track the targets output (larger files)
          # git lfs track "data/**"
          git add --all -- ':!renv'
          for file in $(git ls-files -mo --exclude=renv)
          do
            git add -f $file
          done
          git commit -am "Run pipeline"
          git push origin ${{ steps.extract_branch.outputs.branch }}-runs

      - name: Prepare failure artifact
        if: failure()
        run: rm -rf .git .github .targets-files .${{ steps.extract_branch.outputs.branch }}-runs renv/library renv/cache

      - name: Post failure artifact
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: .
