on:
  push:
    branches:
      - main
      - master
      - dev-adam
      - 2025_website
  pull_request:
    branches:
      - main
      - master

# Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
   # - cron:  '1 0 * * 0' #every sunday just after midnight
    - cron:  '0 0 * * *' #daily at midnight

name: targets

jobs:
  targets:
    runs-on: ubuntu-latest
    # Combined data+website job until Phase D split; cold weather+website can
    # approach ~90m wall-clock. Fail loud instead of hanging until runner kill.
    timeout-minutes: 120
    # Push <branch>-runs after tar_make; default GITHUB_TOKEN is read-only on PRs.
    permissions:
      contents: write
      actions: read
    # Always run inside the published emma image (laptop / GHA / Singularity share this tag).
    # Packages come from the image site-library — do not renv::restore() or update.packages().
    container: adamwilsonlab/emma:latest
    env:
      GITHUB_PAT: ${{ secrets.GH_PAT_BSM }}
      # gh CLI (list_release_assets fast path) reads GH_TOKEN, not GITHUB_PAT.
      GH_TOKEN: ${{ secrets.GH_PAT_BSM }}
      # PRs: skip Quarto website, live GSOD, live iNat, park uploads (GHA OOM).
      # Push/schedule: EMMA_CI_LIGHT=0 but website is still stubbed under GITHUB_ACTIONS
      # (see _targets.R); summary step labels website: stubbed so ✅ ≠ full HTML.
      EMMA_CI_LIGHT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      # Do not preset CMDSTAN to /opt until that image is published; pt1 discovers
      # the path and exports it via GITHUB_ENV for later steps.
    steps:
      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: |
          # PRs use refs/pull/<n>/merge — head_ref is the real feature branch.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            branch="${GITHUB_HEAD_REF}"
          else
            branch="${GITHUB_REF_NAME}"
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          lfs:  'true'
          # Source tip only; full history is not needed for tar_make / runs upload.
          fetch-depth: 1
          # Configure git remote with PAT so push of <branch>-runs is allowed.
          # Without this, PR jobs push as github-actions[bot] and get 403.
          token: ${{ secrets.GH_PAT_BSM }}
      - name: Whitelist directory
        run: git config --global --add safe.directory /__w/emma_report/emma_report
      - name: Checkout LFS objects
        run: git lfs checkout
        continue-on-error: true

      # Prefer <branch>-runs; fall back to main-runs so PR cold starts are not
      # forced through a full weather+website rebuild (OOM / lost communication).
      - name: Resolve runs cache ref
        id: runs-cache
        shell: bash
        run: |
          branch="${{ steps.extract_branch.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "${branch}-runs"; then
            echo "ref=${branch}-runs" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "is_branch_runs=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin main-runs; then
            echo "ref=main-runs" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "is_branch_runs=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "is_branch_runs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout runs cache
        if: steps.runs-cache.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.runs-cache.outputs.ref }}
          fetch-depth: 1
          path: .runs-cache
          lfs: true
          token: ${{ secrets.GH_PAT_BSM }}

      - name: Restore targets store from runs cache
        if: steps.runs-cache.outputs.found == 'true'
        run: |
          git -C .runs-cache lfs checkout || true
          if [ -d .runs-cache/_targets ]; then
            rm -rf _targets
            cp -a .runs-cache/_targets .
            echo "Restored _targets from ${{ steps.runs-cache.outputs.ref }}"
          else
            echo "No _targets/ in runs cache; cold start"
          fi

      - name: Run targets pt 1
        run: |
          Sys.setenv(HOME = "/home/rstudio")
          # Prefer /opt (new portable image); fall back to legacy ~/.cmdstanr.
          candidates <- c(
            "/opt/cmdstan/current",
            Sys.glob("/home/rstudio/.cmdstanr/cmdstan-*"),
            Sys.glob("/opt/cmdstan/cmdstan-*")
          )
          ok <- nzchar(candidates) & vapply(candidates, dir.exists, logical(1))
          cmdstan_dir <- candidates[ok][1]
          if (is.na(cmdstan_dir) || !nzchar(cmdstan_dir)) {
            stop("CmdStan not found under /opt/cmdstan or /home/rstudio/.cmdstanr")
          }
          message("Using CmdStan at ", cmdstan_dir)
          # Clear a stale/missing CMDSTAN from the job env, then set the real path
          # for this process and subsequent workflow steps.
          Sys.unsetenv("CMDSTAN")
          Sys.unsetenv("CMDSTAN_PATH")
          cmdstanr::set_cmdstan_path(cmdstan_dir)
          gh_env <- Sys.getenv("GITHUB_ENV", unset = "")
          if (nzchar(gh_env)) {
            cat(
              sprintf("CMDSTAN=%s\nCMDSTAN_PATH=%s\n", cmdstan_dir, cmdstan_dir),
              file = gh_env,
              append = TRUE
            )
          }
          cmdstanr::check_cmdstan_toolchain()
        shell: Rscript {0}

      - name: Run targets pt 2
        run: |
          Sys.setenv(
            HOME = "/home/rstudio",
            OMP_NUM_THREADS = "1",
            OPENBLAS_NUM_THREADS = "1",
            VECLIB_MAXIMUM_THREADS = "1"
          )
          message("EMMA_CI_LIGHT=", Sys.getenv("EMMA_CI_LIGHT", unset = "<unset>"))
          outdated <- tryCatch(targets::tar_outdated(), error = function(e) character())
          message(
            "Cache check: ", length(outdated), " outdated target(s)",
            if (length(outdated)) paste0(": ", paste(outdated, collapse = ", ")) else ""
          )
          # Incremental make. tar_destroy("all") cold builds (weather ~32m +
          # website ~32m / ~570MB) starve the hosted runner ("lost communication").
          targets::tar_make()
        shell: Rscript {0}

      - name: Summarize website status
        if: always()
        shell: bash
        run: |
          {
            echo "## emma_report CI summary"
            echo ""
            if [ -f docs/.emma_ci_actions_skip ] || [ -f docs/.emma_ci_light_skip ]; then
              echo "website: stubbed"
              echo ""
              echo "Quarto park site was **not** rendered. Schedule/push ✅ means data targets only."
              if [ -f docs/.emma_ci_actions_skip ]; then
                echo ""
                echo '```'
                cat docs/.emma_ci_actions_skip
                echo '```'
              fi
              if [ -f docs/.emma_ci_light_skip ]; then
                echo ""
                echo '```'
                cat docs/.emma_ci_light_skip
                echo '```'
              fi
            elif [ -f docs/index.html ]; then
              echo "website: full"
            else
              echo "website: missing"
            fi
            echo ""
            echo "EMMA_CI_LIGHT=${EMMA_CI_LIGHT}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create the runs branch if it does not already exist
        if: steps.runs-cache.outputs.is_branch_runs != 'true'
        run: git checkout --orphan ${{ steps.extract_branch.outputs.branch }}-runs

      - name: Put the worktree in the runs branch if the latter already exists
        if: steps.runs-cache.outputs.is_branch_runs == 'true'
        run: |
          rm -rf .git
          mv .runs-cache/.git .
          rm -rf .runs-cache

      - name: Cleanup main-runs cache worktree
        if: steps.runs-cache.outputs.found == 'true' && steps.runs-cache.outputs.is_branch_runs != 'true'
        run: rm -rf .runs-cache

      - name: Upload latest run
        id: upload-runs
        # Pipeline success is the job gate. GH_PAT_BSM may lack write on eco-emma
        # (main @ 65263b7e failed push as bmaitner 403 after green tar_make + stub).
        # Soft-fail so schedule/push ✅ tracks data targets, not runs-branch auth.
        # Ops: rotate GH_PAT_BSM to a token with contents:write on this repo for cache reuse.
        continue-on-error: true
        run: |
          set -euo pipefail
          git config --local user.name "GitHub Actions"
          git config --local user.email "actions@github.com"
          # Force PAT credentials (checkout/.git may still be github-actions[bot]).
          git remote set-url origin "https://x-access-token:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          # Phase D0 / R4b hard gate: *-runs tip is _targets cache only.
          # Never force-add Quarto / website outputs (docs, reports, .quarto, …).
          rm -rf .github/workflows
          rm -rf data/temp docs reports .quarto site_libs
          find . -name '*.html.md' -type f -delete 2>/dev/null || true

          # LFS for large target objects; rewrite .gitattributes to targets-only.
          git lfs install --local
          git lfs track "_targets/objects/**"
          test -f .gitattributes

          # Drop any previously tracked bloat from the index (bloated main-runs tip).
          # Keep the worktree otherwise; we only stage the thin cache paths below.
          git rm -r --cached -f --ignore-unmatch . >/dev/null 2>&1 || true

          # _targets is gitignored on main — force-add ONLY these paths.
          git add -f .gitattributes
          if [ -d _targets ]; then
            git add -f _targets
          else
            echo "WARNING: no _targets/ directory to upload" >&2
          fi

          # Refuse to stage forbidden paths even if something recreated them.
          forbidden='^(docs/|reports/|\.quarto/|site_libs/|.*\.html\.md$)'
          if git diff --cached --name-only | grep -E "$forbidden"; then
            echo "ERROR: refused to commit Quarto/website paths to *-runs" >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Nothing new in thin runs cache; skipping commit"
          else
            git commit -m "Run pipeline (targets cache only)"
          fi
          git push origin "${{ steps.extract_branch.outputs.branch }}-runs"

      - name: Note runs-upload outcome
        if: always()
        shell: bash
        run: |
          {
            echo ""
            if [ "${{ steps.upload-runs.outcome }}" = "success" ]; then
              echo "runs-upload: ok"
            elif [ "${{ steps.upload-runs.outcome }}" = "skipped" ]; then
              echo "runs-upload: skipped"
            else
              echo "runs-upload: failed (soft) — pipeline still green; fix GH_PAT_BSM write access"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare failure artifact
        if: failure()
        run: rm -rf .git .github .targets-files .runs-cache

      - name: Post failure artifact
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: .
